name: ml-lint
on:
  push: { paths: ['ml/**', 'tools/**'] }
  pull_request: { paths: ['ml/**', 'tools/**'] }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ruff
      - run: ruff check ml tools
      - run: python -m py_compile ml/train.py ml/export_tflite_int8.py ml/eval.py ml/dataset/split_dataset.py tools/benchmark/analyze_distance.py
      - run: bash -n tools/fetch_models.sh
