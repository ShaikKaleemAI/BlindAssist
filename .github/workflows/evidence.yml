name: evidence
# Verification done by machines, not by the author: build, unit tests, lint, emulator smoke test, merged-manifest check,
# then tools/score.py grades the project from the resulting files. See docs/evidence/README.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build, test, lint, manifest check (outcomes recorded, never faked)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; G=./gradlew; else G=gradle; fi
          mkdir -p docs/evidence/ci/junit
          b=false; l=false
          $G assembleDebug --stacktrace && b=true || true
          $G testDebugUnitTest --continue --stacktrace || true
          $G lintDebug --stacktrace && l=true || true
          inet=null
          m=$(find app/build -path '*merged_manifests*' -name AndroidManifest.xml | grep -i debug | head -1 || true)
          if [ -n "$m" ]; then if grep -q 'android.permission.INTERNET' "$m"; then inet=true; else inet=false; fi; fi
          cp app/build/test-results/testDebugUnitTest/*.xml docs/evidence/ci/junit/ 2>/dev/null || true
          printf '{"assembleDebug": %s, "lint": %s, "emulator_smoke": false, "internet_permission_in_merged_manifest": %s, "run": "%s", "date": "%s"}\n' \
            "$b" "$l" "$inet" "$GITHUB_RUN_ID" "$(date -u +%F)" > docs/evidence/ci/build.json
          cat docs/evidence/ci/build.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence
          path: |
            docs/evidence/ci
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: bash -c 'if [ -f ./gradlew ]; then ./gradlew connectedDebugAndroidTest --stacktrace; else gradle connectedDebugAndroidTest --stacktrace; fi'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: app/build/reports/androidTests
  score:
    needs: [build, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ci-evidence, path: ci-evidence }
        continue-on-error: true
      - name: Merge evidence and score
        run: |
          mkdir -p docs/evidence/ci
          cp -r ci-evidence/docs/evidence/ci/* docs/evidence/ci/ 2>/dev/null || true
          if [ -f docs/evidence/ci/build.json ]; then
            e=false; [ "${{ needs.emulator.result }}" = "success" ] && e=true
            jq --argjson e "$e" '.emulator_smoke=$e' docs/evidence/ci/build.json > /tmp/b.json && mv /tmp/b.json docs/evidence/ci/build.json
          fi
          python3 tools/score.py .
          cat docs/generated/SCORE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: score
          path: |
            docs/generated/SCORE.md
            docs/evidence/ci
